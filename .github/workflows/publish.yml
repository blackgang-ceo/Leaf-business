name: Publish LeafBlitz site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No more write access to the repo: the site files are the source of truth and
# CI only validates + publishes them.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Static site checks (structure, links, contacts, a11y)
        run: |
          python3 tools/check_site.py index.html
          python3 tools/check_site.py 404.html

      - name: Syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import subprocess, sys, tempfile
          sys.path.insert(0, 'tools')
          from check_site import extract_scripts

          failed = 0
          for i, body in enumerate(extract_scripts('index.html')):
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as fh:
                  fh.write(body)
                  path = fh.name
              result = subprocess.run(['node', '--check', path], capture_output=True, text=True)
              if result.returncode != 0:
                  failed += 1
                  print(f'--- inline script #{i} failed node --check ---')
                  print(result.stderr)
          sys.exit(1 if failed else 0)
          PY

      - name: Runtime smoke test (jsdom, no CDNs — advisory)
        continue-on-error: true
        run: |
          cd tools
          npm install --no-audit --no-fund
          node smoke_test.js ../index.html

      - name: Verify JSON-LD and site icons parse
        run: |
          python3 tools/make_icons.py >/dev/null && echo "icon generator OK"
          python3 - <<'PY'
          import json, re, sys
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          assert blocks, 'no JSON-LD block found'
          for b in blocks:
              json.loads(b)
          print(f'{len(blocks)} JSON-LD block(s) valid')
          PY

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published site
        uses: actions/checkout@v4

      - name: Stage only the public site files
        run: |
          mkdir -p _site
          cp index.html 404.html favicon.svg apple-touch-icon.png robots.txt sitemap.xml _site/
          ls -la _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
